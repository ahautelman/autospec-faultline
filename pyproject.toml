[project]
name = "faultline"
version = "0.1.0"
description = "FaultLine: a fault-injection recovery benchmark for AutoSpec"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
# Real PPO edge learner. Kept optional so the parser, compiler, environment, and
# refinement operators install and test without the heavier RL stack.
# stable-baselines3 may lag the newest Python, so the interop extra may need an
# interpreter the library supports.
interop = [
    "stable-baselines3>=2.3",
    "scikit-learn>=1.4",
]
dev = [
    "pytest>=8.0",
]
# Reporting extras for the 9-rooms run: plotting plus the progress bars the long
# run prints. The pipeline imports them lazily, so the library and the default
# test suite stay free of these dependencies.
reports = [
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The 9-rooms PPO acceptance suite is slow and needs the interop extra, so the
# default run excludes it; select it with `pytest -m slow`.
addopts = "-q -m 'not slow'"
markers = [
    "slow: trains PPO edge policies; run with `pytest -m slow` and the interop extra",
]
